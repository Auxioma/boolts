doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # MySQL implicitly commits on DDL, so wrapping migrations in a transaction
    # is meaningless and triggers a deprecation on commit/rollback.
    transactional: false
