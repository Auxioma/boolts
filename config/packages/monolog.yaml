monolog:
    # "success" is an application channel: inject monolog.logger.success and log successful actions at info level.
    channels:
        - deprecation
        - frontend
        - success
        - subscription

    handlers:
        # Errors and more severe events (critical, alert, emergency).
        error:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.error.log"
            level: error
            channels: ["!frontend"]

        # Keep warnings isolated from errors and informational application logs.
        warning:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.warning.log"
            level: warning
            max_level: warning

        # Browser JavaScript, CSS-resource, and HTML rendering errors reported by the client.
        frontend:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.frontend.log"
            level: error
            channels: [frontend]

        # This handler deliberately accepts only records from the explicit success channel.
        success:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.success.log"
            level: info
            max_level: info
            channels: [success]

        subscription:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.subscription.log"
            level: info
            channels: [subscription]

        # Preserve diagnostics without duplicating errors, warnings, or business-success logs.
        application:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
            max_level: notice
            channels: ["!event", "!deprecation", "!frontend", "!success"]

when@dev:
    monolog:
        handlers:
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@prod:
    monolog:
        handlers:
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.deprecation.log"
