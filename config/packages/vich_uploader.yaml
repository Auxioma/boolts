vich_uploader:
    db_driver: orm
    storage: file_system

    metadata:
        type: attribute

    mappings:
        avatars:
            uri_prefix: /images/avatars
            upload_destination: '%kernel.project_dir%/public/images/avatars'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true

        biens:
            uri_prefix: /properties
            upload_destination: '%kernel.project_dir%/public/properties'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            # directory_namer: App\Vich\PropertyDirectoryNamer
            delete_on_update: true
            delete_on_remove: true