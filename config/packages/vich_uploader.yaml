vich_uploader:
    db_driver: orm
    storage: file_system

    metadata:
        type: attribute

    mappings:
        avatars:
            uri_prefix: /avatars
            upload_destination: '%kernel.project_dir%/public/avatars'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            directory_namer: App\Vich\AvatarDirectoryNamer
            delete_on_update: true
            delete_on_remove: true

        messagerie:
            uri_prefix: /messagerie
            upload_destination: '%kernel.project_dir%/public/messagerie'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true

        # Documents de la messagerie : hors du dossier public, servis par
        # MessagerieDocumentController aux seuls participants de la conversation.
        messagerie_documents:
            uri_prefix: /messagerie/documents
            upload_destination: '%kernel.project_dir%/var/messagerie_documents'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true

        biens:
            uri_prefix: /properties
            upload_destination: '%kernel.project_dir%/public/properties'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            directory_namer: App\Vich\PropertyDirectoryNamer
            delete_on_update: true
            delete_on_remove: true
