security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            entry_point: App\Security\VisiteurAuthenticator

            custom_authenticators:
                - App\Security\GoogleAuthenticator
                - App\Security\VisiteurAuthenticator
                - App\Security\AgenceImmobiliereAuthenticator
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            two_factor:
                auth_form_path: 2fa_login    # The route name you have used in the routes.yaml
                check_path: 2fa_login_check  # The route name you have used in the routes.yaml

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /
                always_remember_me: true
                secure: true
                httponly: true
                samesite: lax
                signature_properties: ['password']

            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }

        - {
            path: ^/admin,
            roles: ROLE_ADMIN,
            allow_if: "is_granted('ROLE_ADMIN') and not is_granted('ROLE_AGENCE') and not is_granted('ROLE_USER')"
        }

        - {
            path: ^/pro,
            roles: ROLE_AGENCE,
            allow_if: "is_granted('ROLE_AGENCE') and not is_granted('ROLE_ADMIN') and not is_granted('ROLE_USER')"
        }

        - {
            path: ^/user,
            roles: ROLE_USER,
            allow_if: "is_granted('ROLE_USER') and not is_granted('ROLE_ADMIN') and not is_granted('ROLE_AGENCE')"
        }

        - { path: ^/, roles: PUBLIC_ACCESS, requires_channel: https }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
