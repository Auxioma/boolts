# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.languages: ['fr', 'en']
    app.2fa.from_email: 'noreply@boolts.com'
    app.2fa.from_name: 'Boolts'
    stripe.secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe.public_key: '%env(STRIPE_PUBLIC_KEY)%'
    stripe.webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'
    app.url: '%env(APP_URL)%'
    app.subscription_batch_size: 100
    # app_driven: Boolts appelle /v1/invoices/{id}/pay sur l'invoice ouverte existante.
    # En production, désactiver/configurer Stripe Smart Retries pour ne pas avoir deux moteurs de relance concurrents.
    # stripe_managed: Boolts observe uniquement les relances Stripe et synchronise la base.
    app.subscription_retry_strategy: 'app_driven'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\DatabaseTranslator:
        decorates: 'translator'
        arguments: ['@.inner', '@App\Repository\TranslationRepository']

    App\Mailer\TwoFactorEmailMailer:
        arguments:
            $mailer: '@mailer'
            $fromEmail: '%app.2fa.from_email%'
            $fromName: '%app.2fa.from_name%'
        public: true
        tags: ['scheb_two_factor.auth_code_mailer'] # ou alias ci-dessous
    app.2fa_mailer: '@App\Mailer\TwoFactorEmailMailer'

    App\Service\ContactForm\ContactMailer:
        arguments:
            $mailerFromEmail: '%env(MAILER_FROM_EMAIL)%'
            $mailerFromName: '%env(MAILER_FROM_NAME)%'

    App\Service\Document\AdminDocumentNotificationMailer:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $adminEmail: '%env(ADMIN_EMAIL)%'
            $adminName: '%env(ADMIN_NAME)%'
            $mailerFromEmail: '%env(MAILER_FROM_EMAIL)%'
            $mailerFromName: '%env(MAILER_FROM_NAME)%'

    App\Service\Document\ClientDocumentNotificationMailer:
        arguments:
            $mailerFromEmail: '%env(MAILER_FROM_EMAIL)%'
            $mailerFromName: '%env(MAILER_FROM_NAME)%'

    App\Service\MapboxAddressTranslator:
        arguments:
            $mapboxToken: '%env(MAPBOX_PUBLIC_TOKEN)%'

    App\Service\GeoIpLocationService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Stripe\StripeClient:
        arguments:
            - '%stripe.secret_key%'

    App\Service\PropertyViewTracker:
        arguments:
            $kernelSecret: '%kernel.secret%'

    App\Service\Subscription\:
        resource: '../src/Service/Subscription/'
        bind:
            $logger: '@monolog.logger.subscription'

    App\Command\ProcessSubscriptionsCommand:
        arguments:
            $logger: '@monolog.logger.subscription'

    App\Controller\StripeWebhookController:
        arguments:
            $logger: '@monolog.logger.subscription'

    App\Controller\Account\SubscriptionLifecycleController:
        arguments:
            $logger: '@monolog.logger.subscription'

    App\MessageHandler\Billing\SendSubscriptionEmailMessageHandler:
        arguments:
            $logger: '@monolog.logger.subscription'
            $mailerFromEmail: '%env(MAILER_FROM_EMAIL)%'
            $mailerFromName: '%env(MAILER_FROM_NAME)%'

